<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GPT Image GIF Playbook</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>GPT Image GIF Playbook</h1>
    <p>37 GIF posts and 6 video workflows.</p>
  </header>

  <div class="tools">
    <label class="search" for="search">Search
      <input id="search" type="search" autocomplete="off" placeholder="Title or author">
    </label>
    <div id="category-filters" class="filters" role="toolbar" aria-label="Categories"></div>
    <p id="count" class="count" aria-live="polite"></p>
  </div>

  <p id="empty" class="empty" hidden>No posts match.</p>
  <main id="grid" class="grid"></main>

  <footer class="foot">
    <a href="https://github.com/LPJXLOVE/gpt-image-gif-playbook/blob/main/RIGHTS.md">Rights</a>
  </footer>

  <script src="app.js" defer></script>
</body>
</html>
